services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [monitoring]
    user: "65534:65534"
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    environment:
      GOMAXPROCS: "2"
      GOMEMLIMIT: "180MiB"
    command:
      - --config.file=/etc/ocr-monitoring/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=1GB
      - --query.max-concurrency=4
      - --query.max-samples=100000
      - --query.timeout=5s
    volumes:
      - ./ops/monitoring:/etc/ocr-monitoring:ro
      - prometheus-data:/prometheus
    secrets: [metrics_token]
    ports: ["127.0.0.1:${MONITORING_PROMETHEUS_PORT:-9290}:9090"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    depends_on:
      alertmanager: {condition: service_started}

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    profiles: [monitoring]
    user: "65534:65534"
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    environment:
      GOMAXPROCS: "2"
      GOMEMLIMIT: "80MiB"
    command:
      - --config.file=/etc/ocr-monitoring/alertmanager.yaml
      - --storage.path=/alertmanager
      - --data.retention=24h
      - --cluster.listen-address=
    volumes:
      - ./ops/monitoring:/etc/ocr-monitoring:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:${MONITORING_ALERTMANAGER_PORT:-9293}:9093"]
    tmpfs: ["/tmp:size=16m,mode=1777"]

volumes:
  prometheus-data:
  alertmanager-data:
