name: Rust checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis_oom:
        image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ocr_test
          POSTGRES_USER: ocr
          POSTGRES_PASSWORD: ocr-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ocr -d ocr_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://ocr:ocr-test@localhost:5432/ocr_test
      # CI service is disposable; role/ownership tests create their own DBs.
      TEST_ADMIN_DATABASE_URL: postgres://ocr:ocr-test@localhost:5432/ocr_test
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_OOM_URL: redis://localhost:6380/0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install PDF renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Source comment policy
        run: |
          python3 -m unittest discover -s scripts -p test_no_block_comments.py
          python3 scripts/check_no_block_comments.py
          python3 -m unittest discover -s scripts -p test_release_manifest.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked -- --ignored --test-threads=1

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: bash scripts/audit-dependencies.sh

  images:
    # Builds the images Compose deploys, scans them and runs the packaged
    # fixture-model smoke. This verifies packaging, isolation wiring and
    # recovery paths; it is not OCR quality or real-model capacity evidence.
    runs-on: ubuntu-latest
    needs: [check, dependencies]
    env:
      TRIVY_VERSION: 0.76.0
      TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Linux parser verification target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: parser-verification
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Linux backup verification target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backup-rehearsal-builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose files
        run: |
          docker compose --env-file .env.example -f compose.yaml -f compose.demo.yaml config -q
          docker compose --env-file .env.production.example -f compose.production.yaml -f compose.production.smoke.yaml config -q
          docker compose --env-file /dev/null -f compose.verify.yaml config -q
          docker compose --env-file /dev/null -f compose.test.yaml config -q
          export BACKUP_KEY_DIR=/nonexistent BACKUP_VOLUME=ci OCR_RESTORE_PROJECT=ci RESTORE_SECRETS_DIR=/nonexistent
          docker compose --env-file /dev/null -f compose.backup.yaml config -q
          docker compose --env-file /dev/null -f compose.restore.yaml config -q
      - name: Build parser image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: parser-runtime
          load: true
          tags: ocr-service:parser-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ocr-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build backup operations image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backup-ops
          load: true
          tags: ocr-service:backup-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Trivy (checksum-verified release)
        run: |
          curl -fsSLo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo install trivy /usr/local/bin/trivy
      - name: SBOM and vulnerability scan
        # Fails on fixable CRITICAL findings; HIGH findings are reported for review.
        run: |
          mkdir -p release
          for image in "ocr-service:${{ github.sha }}" "ocr-service:parser-${{ github.sha }}" "ocr-service:backup-${{ github.sha }}"; do
            name=${image#ocr-service:}
            trivy image --quiet --format cyclonedx --output "release/sbom-$name.cdx.json" "$image"
            trivy image --quiet --severity HIGH,CRITICAL --format table "$image" | tee "release/vulnerabilities-$name.txt"
            trivy image --quiet --exit-code 1 --ignore-unfixed --severity CRITICAL "$image"
          done
          docker image inspect --format '{{index .RepoTags 0}} {{.Id}}' "ocr-service:${{ github.sha }}" "ocr-service:parser-${{ github.sha }}" "ocr-service:backup-${{ github.sha }}" | tee release/image-ids.txt
      - name: Local release inventory and digest lock
        run: |
          python3 scripts/release-manifest.py \
            --app-image "ocr-service:${{ github.sha }}" \
            --parser-image "ocr-service:parser-${{ github.sha }}" \
            --backup-image "ocr-service:backup-${{ github.sha }}" \
            --output release/inventory
      - name: Packaged smoke (fixture model, slow responses, parser faults)
        env:
          PROD_IMAGE: ocr-service:${{ github.sha }}
          PROD_PARSER_IMAGE: ocr-service:parser-${{ github.sha }}
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/smoke
        run: scripts/production-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            release/
            ${{ runner.temp }}/smoke/*.json
            ${{ runner.temp }}/smoke/*.txt
