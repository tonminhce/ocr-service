  - eval_time: 60s
    alertname: OCRTargetDown
    exp_alerts:
    - exp_labels:
        job: ocr-worker
        instance: worker:9092
        severity: critical
        policy: candidate-v1
      exp_annotations: *id001
  - eval_time: 180s
    alertname: OCRTargetDown
    exp_alerts: []
