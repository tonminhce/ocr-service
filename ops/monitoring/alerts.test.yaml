rule_files:
- alerts.yaml
evaluation_interval: 15s
tests:
- name: OCRTargetDown exact hold boundary and recovery for up{job="ocr-api",instance="api:9091"}
  interval: 15s
  input_series:
  - series: up{job="ocr-api",instance="api:9091"}
    values: 0x11 1x29
  alert_rule_test:
  - eval_time: 45s
    alertname: OCRTargetDown
    exp_alerts: []
  - eval_time: 60s
    alertname: OCRTargetDown
    exp_alerts:
    - exp_labels:
        job: ocr-api
        instance: api:9091
        severity: critical
        policy: candidate-v1
      exp_annotations: &id001
        summary: OCR or monitoring metrics target is unavailable
        runbook: docs/alert-runbook.md#ocrtargetdown
  - eval_time: 180s
    alertname: OCRTargetDown
    exp_alerts: []
- name: OCRTargetDown exact hold boundary and recovery for up{job="ocr-worker",instance="worker:9092"}
  interval: 15s
  input_series:
