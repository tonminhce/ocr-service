# Protocol/permissions fixture only: no OCR quality or model-performance claim.
# Combine with standalone compose.production.yaml in a separate project.
services:
  worker:
    volumes: !override
      - parser-socket-data:/run/ocr-parser
    environment:
      OCR_STRATEGY: full_page_vlm
      VLLM_BASE_URL: http://mock-vllm:8000/v1
      VLLM_MODEL: mock-ocr
    depends_on:
      mock-vllm: {condition: service_started}
  mock-vllm:
    image: ${PROD_IMAGE:-ocr-service:a05}
    command: [mock-vllm]
    environment:
      MOCK_BIND_ADDR: 0.0.0.0:8000
    user: "10001:10001"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
